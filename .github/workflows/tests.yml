name: OrbitGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: 单元/集成测试（${{ matrix.os }} / py${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suites
        shell: bash
        run: |
          set -e
          for t in test_faults test_rsm test_dtm test_gateway test_orchestrator test_egm test_five_module test_gate; do
            echo "===== tests/$t.py ====="
            python "tests/$t.py"
          done

  benchmark:
    name: 量化实验（ubuntu / py3.12）
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark
        run: python experiments/run_benchmark.py
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            docs/benchmark_report.txt
            docs/benchmark_results.json
          retention-days: 14
